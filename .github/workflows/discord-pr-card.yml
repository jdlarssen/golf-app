# Discord PR-kort (#1159 + #1406): reagerer når en åpen PR blir CI-grønn —
# uansett opphav (natt-runner, CI-vakt, dok-avstemmer, interaktiv økt). Tre utfall
# (decide-steget): kvalifisert PR uten produktvalg → auto-merge + kvitteringskort;
# produktvalg/aldri-liste/manglende staging-bevis → knapp-kort (menneske-porten);
# ellers no-op. Del B: rører diffen en visuell flate, festes staging-skjermbilder
# på kortet. Mottaker-siden (knappen) er #1124-endepunktet. Se
# docs/loops/discord-pr-kort.md.
name: Discord PR-kort

on:
  # Fyrer når CI-workflowen fullfører (pass ELLER fail). decide-steget re-spør ALLE
  # check-runs og gater, så en fail blir en ufarlig no-op. Vi bruker workflow_run
  # (ikke check_suite): check_suite fyrer IKKE for GitHub-Actions-suiter (anti-
  # rekursjon), så CI-en vår trigget aldri kortet — bekreftet på #1162.
  # «CI (docs no-op)» (#1483): docs-only-PR-er kjører ikke ci.yml, men tvillingen
  # (ci-docs-noop.yml, #1477) fullfører på sekunder — den fyringen VENTER på at
  # resten av checkene lander (WAIT_FOR_CHECKS under), siden scan/Vercel typisk
  # fortsatt kjører. Blandet PR (kode + docs): ci.yml-fyringen kansellerer den
  # ventende tvilling-kjøringen via concurrency-gruppa (samme head-SHA).
  workflow_run:
    workflows: [CI, "CI (docs no-op)"]
    types: [completed]
  # Draft-først (#1516): decide noop-er drafts («økta jobber fortsatt»), og
  # `gh pr ready` re-trigger ikke CI — uten denne triggeren ville en ready-flippet
  # PR aldri fått kort/auto-merge. Ready-eventet er øktas «jeg er ferdig»-signal.
  pull_request:
    types: [ready_for_review]
  # Manuell testing / re-post mot en spesifikk PR. (Produsent-dispatch for
  # docs-only-PR-er (#1301) er OVERFLØDIG etter #1483 — tvilling-triggeren over
  # dekker dem hendelsesdrevet; eksisterende dispatches er ufarlige duplikater,
  # dedup-labelen + concurrency sluker dem.)
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR-nummer å poste kort for'
        required: true
        type: string

# Serialiser per head-SHA så samtidige fullføringer ikke gir dobbelt kort.
concurrency:
  group: discord-pr-card-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || inputs.pr }}
  cancel-in-progress: true

# Ingen tilgang som standard. Hver jobb under ber om akkurat det den trenger.
permissions: {}

# Tre jobber, delt etter hva de får lov til. Koden i en PR er ikke lest av eieren
# når kortet lages, så den kjører bare i `card-screenshots`, som verken kan skrive
# til repoet eller har Discord-nøklene. `card-decide` og `post-card` kjører main
# sin kode. Jobbnavnene står også i `CARD_CHECK_NAMES` (lib/loops/prCard.ts).
# Ingen checkout lar tilgangsnøkkelen ligge igjen i arbeidsmappa
# (persist-credentials: false). Reglene er låst av tests/hooks/guard.test.sh.
jobs:
  # ── AVGJØR: port + gate + visuell-diff-deteksjon. Leser bare fra GitHub. ──
  card-decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # PR-en, endrede filer, commit-lista
      issues: read # kommentarer + etiketter på lenkede issues
      checks: read
      actions: read # ci.yml-kjøringene for head-SHA-en
    outputs:
      run: ${{ steps.guard.outputs.run }}
      outcome: ${{ steps.decide.outputs.outcome }}
      is_gui: ${{ steps.decide.outputs.is_gui }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      # To porter før noe annet kjører:
      #  1. Discord-boten må være satt opp.
      #  2. PR-ens kode må ligge i DETTE repoet. `card-screenshots` kjører den
      #     koden med staging-nøklene. Kode fra en annen kopi av repoet (en fork)
      #     får aldri kjøre her: da blir det ikke noe kort, og eieren ser PR-en i
      #     GitHub. Ukjent opphav teller som fremmed (fail-closed).
      - name: Skip if Discord bot is not configured or the PR code is not from this repository
        id: guard
        env:
          BOT: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL: ${{ secrets.DISCORD_CHANNEL_ID }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_INPUT: ${{ inputs.pr }}
        run: |
          # pr-head-trust:start
          if [ -z "$BOT" ] || [ -z "$CHANNEL" ]; then
            echo "::notice::DISCORD_BOT_TOKEN/DISCORD_CHANNEL_ID ikke satt — PR-kort kan ikke postes."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT_NAME" in
            workflow_run) HEAD_REPO="$RUN_HEAD_REPO" ;;
            pull_request) HEAD_REPO="$PR_HEAD_REPO" ;;
            workflow_dispatch)
              case "$PR_INPUT" in
                ''|*[!0-9]*) HEAD_REPO="" ;;
                *) HEAD_REPO="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_INPUT" --jq '.head.repo.full_name // ""' 2>/dev/null || true)" ;;
              esac ;;
            *) HEAD_REPO="" ;;
          esac
          if [ -n "$GITHUB_REPOSITORY" ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PR-ens kode ligger ikke i $GITHUB_REPOSITORY (fikk «$HEAD_REPO») — ingen kort, ingen kjøring av koden."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          # pr-head-trust:end

      # Main sin kode — aldri PR-ens. Decide leser PR-en gjennom GitHubs API.
      - name: Checkout (main)
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node 22
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Gate + visuell-diff-deteksjon (ingen npm ci). Ved dispatch venter steget på
      # at checkene lander (maks ~10 min, #1301) — timeout-minutes rommer ventingen
      # med god margin.
      - name: Decide
        id: decide
        if: steps.guard.outputs.run == 'true'
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          # Vent på checkene ved dispatch (#1301), ved tvilling-fyring (#1483) OG ved
          # ready-flipp (#1516): tvillingen fullfører før scan/Vercel, og en økt kan
          # markere ready rett etter siste push mens checkene fortsatt kjører — uten
          # venting ville kortet no-op'e på pending og aldri få en ny fyring.
          # Unntak (#2095): ready-flipp mens ci.yml fortsatt kjører gir fra seg med en
          # gang — relékjøringen (workflow_run) kommer garantert og tar over.
          WAIT_FOR_CHECKS: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.workflow_run.name == 'CI (docs no-op)') && 'true' || 'false' }}
        run: npx --yes tsx@4.23.15 scripts/loops/decide-pr-card.ts

      # Planen går videre som jobb-utdata, ikke som fil: de to neste jobbene får
      # den slik decide skrev den, og jobben som kjører PR-ens kode kan ikke endre
      # hva post-jobben leser.
      - name: Planen som jobb-utdata
        id: plan
        if: steps.guard.outputs.run == 'true'
        run: |
          if [ -f pr-card-plan.json ]; then
            echo "plan=$(base64 -w0 pr-card-plan.json)" >> "$GITHUB_OUTPUT"
          fi

  # ── SKJERMBILDER (kun visuell diff): booter PR-ens kode mot staging og tar
  # skjermbilder av berørte ruter. Best-effort — feil her feller ikke kortet.
  # Eneste jobb som sjekker ut PR-ens kode: bare lesetilgang, ingen nøkler utover
  # staging-nøklene appen trenger for å starte. ──
  card-screenshots:
    needs: card-decide
    if: needs.card-decide.outputs.run == 'true' && needs.card-decide.outputs.outcome != 'noop' && needs.card-decide.outputs.is_gui == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      # Versjonen decide gatet — den samme post-jobben merger eller lager kort for.
      - name: Checkout (PR-head)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.card-decide.outputs.head_sha }}
          persist-credentials: false

      # Automasjons-skriptene (scripts/loops, lib/loops) hentes alltid fra main —
      # en PR-branch kan være forket før disse filene fantes, og da feiler
      # `tsx`-steget under med ERR_MODULE_NOT_FOUND (#1181).
      - name: Bruk main sin versjon av loop-skriptene
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- scripts/loops lib/loops

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Skjermbilder av GUI-ruter (staging)
        env:
          PLAN_B64: ${{ needs.card-decide.outputs.plan }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_PLAYER_EMAIL: ${{ secrets.E2E_PLAYER_EMAIL }}
          RESEND_STUB_SEND: 'true'
          SELFREG_RATE_LIMIT_DISABLED: 'true'
        run: |
          printf '%s' "$PLAN_B64" | base64 -d > pr-card-plan.json
          npm ci
          # Turbopack native binding-guard (#1095) — dev-serveren nekter å boote uten.
          BINDING=@next/swc-linux-x64-gnu
          if ! node -e "require('$BINDING')" 2>/dev/null; then
            echo "::warning::$BINDING mangler etter npm ci — reinstallerer (#1095)"
            npm install --no-save --force "$BINDING@$(node -p "require('next/package.json').version")"
          fi
          npx playwright install --with-deps chromium
          # Boot dev-serveren mot staging i bakgrunnen, vent på :3000.
          npm run dev > /tmp/dev.log 2>&1 &
          DEV_PID=$!
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:3000/ || true)
            if [ "$CODE" != "000" ] && [ -n "$CODE" ]; then echo "dev up (HTTP $CODE)"; break; fi
            sleep 3
          done
          npx --yes tsx@4.23.15 scripts/loops/screenshot-routes.ts || echo "::warning::skjermbilder feilet (best-effort)"
          kill "$DEV_PID" 2>/dev/null || true

      # Også når steget over feilet halvveis: bildene som rakk å bli tatt, blir med.
      - name: Last opp skjermbildene
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-shots
          path: pr-shots/
          if-no-files-found: ignore
          retention-days: 1

  # ── POST: auto-merge + kvittering ELLER knapp-kort (etter outcome), fest evt.
  # skjermbilder (multipart). Eneste jobb med skrivetilgang — kjører main sin kode. ──
  post-card:
    needs: [card-decide, card-screenshots]
    # !cancelled(): skjermbilde-jobben kan være hoppet over eller ha feilet uten at
    # kortet skal utebli, men en avbrutt kjøring (nyere fyring tok over) poster ikke.
    if: ${{ !cancelled() && needs.card-decide.result == 'success' && needs.card-decide.outputs.run == 'true' && needs.card-decide.outputs.outcome != 'noop' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # auto-merge PR-en (#1406)
      actions: write # main-verify-dispatch etter auto-merge (#1406)
      pull-requests: write # dedup-label + merge
      issues: write # dedup-label (labels går via issues-API)
      checks: read
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Bildene kommer fra jobben som kjørte PR-ens kode. De leses bare som
      # bildefiler og festes på kortet; planen kommer fra decide.
      - name: Hent skjermbildene
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pr-shots
          path: pr-shots

      - name: Post merge-kort
        env:
          PLAN_B64: ${{ needs.card-decide.outputs.plan }}
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s' "$PLAN_B64" | base64 -d > pr-card-plan.json
          npx --yes tsx@4.23.15 scripts/loops/post-pr-card.ts

  # Rød kjøring skal aldri dø stille (samme mønster som prod-vakt/schema-drift).
  # Skjermbilde-jobben er best-effort og teller ikke.
  card-alert:
    needs: [card-decide, post-card]
    if: ${{ !cancelled() && (needs.card-decide.result == 'failure' || needs.post-card.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open alert issue on failure
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="CI-vakt: discord-pr-kort-workflowen rød"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Åpent varsel-issue finnes allerede — hopper over."
            exit 0
          fi
          BODY=$(printf 'Discord-PR-kort-workflowen feilet uventet.\n\nKjøring: %s\n\nFix-protokoll: `docs/loops/discord-pr-kort.md`.' "$RUN_URL")
          gh api "repos/$GITHUB_REPOSITORY/issues" \
            -f title="$TITLE" \
            -f body="$BODY" \
            -f "labels[]=bug" \
            -F milestone=9
