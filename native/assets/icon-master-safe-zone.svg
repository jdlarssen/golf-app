<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <title>Tørny icon — safe-zone motif</title>
  <!-- Motif-only variant (no background, transparent) of the same brand mark,
       scaled 0.7x about the canvas centre so the T+ball group sits comfortably
       inside Android's adaptive-icon safe zone (~66% diameter) AND the
       maskable-icon safe zone (80% diameter) — the smaller of the two bounds is
       honoured so one master serves both consumers. Used for:
       android-foreground-432, the maskable-192/512 motif layer, ic_maskable in
       the Play shell, and ios-splash-logo (the dark splash). -->
  <defs>
    <radialGradient id="ball-shade" cx="0.42" cy="0.38" r="0.62">
      <stop offset="0.55" stop-color="#14201A" stop-opacity="0"/>
      <stop offset="1" stop-color="#14201A" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="ball-light" cx="0.36" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#F8F6F0" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#F8F6F0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(40 40) scale(0.7) translate(-40 -40)">
    <text x="40" y="65.66" text-anchor="middle" font-size="50" font-family="Fraunces, Georgia, serif" font-weight="500" style="font-variation-settings:'opsz' 48" fill="#F8F6F0">T</text>
    <ellipse cx="40" cy="30.14" rx="4.9" ry="0.9" fill="#14201A" opacity="0.35"/>
    <circle cx="40" cy="23.34" r="7" fill="#C9A961"/>
    <circle cx="40" cy="23.34" r="7" fill="url(#ball-shade)"/>
    <circle cx="40" cy="23.34" r="7" fill="url(#ball-light)"/>
  </g>
</svg>
