<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <title>Tørny icon — safe-zone motif (#1985 C: bare dybde)</title>
  <!-- Dagens komposisjon (T + prikk oppe til høyre), med gradient, skygge og større prikk. Kun motivet, transparent, skalert 0.7x om senter (Android adaptive ~66 % og maskable 80 %). -->
  <defs>
    <radialGradient id="ball-shade" cx="0.42" cy="0.38" r="0.62">
      <stop offset="0.55" stop-color="#14201A" stop-opacity="0"/>
      <stop offset="1" stop-color="#14201A" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="ball-light" cx="0.36" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#F8F6F0" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#F8F6F0" stop-opacity="0"/>
    </radialGradient>
    <filter id="t-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#14201A" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g transform="translate(40 40) scale(0.7) translate(-40 -40)">
    <g filter="url(#t-shadow)"><text x="14" y="58" font-size="52" font-family="Fraunces, Georgia, serif" font-weight="500" style="font-variation-settings:'opsz' 48" fill="#F8F6F0">T</text></g>
    <circle cx="59" cy="31" r="7" fill="#C9A961"/>
    <circle cx="59" cy="31" r="7" fill="url(#ball-shade)"/>
    <circle cx="59" cy="31" r="7" fill="url(#ball-light)"/>
  </g>
</svg>
