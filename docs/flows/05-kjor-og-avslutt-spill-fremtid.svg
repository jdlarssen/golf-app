<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1244" viewBox="0 0 1180 1244" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8A6D27"/></marker></defs>
  <rect width="1180" height="1244" fill="#F8F6F0"/>
  <text x="120" y="58" font-family="Georgia, serif" font-size="32" font-weight="600" fill="#8A6D27">5 · Kjør og avslutt — slik blir det</text>
  <text x="121" y="88" font-size="15" fill="#6B7770">Samme flyt, men den kan aldri låse seg. Varsler går alltid i appen først — ingen unødvendig mail.</text>
  <g font-size="13">
    <rect x="118" y="104" width="34" height="20" rx="10" fill="#C9A961"/><text x="135" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">NY</text>
    <text x="160" y="119" fill="#6B7770">= endringen vi skal gjøre (med issue-nummer)</text>
  </g>

  <rect x="120" y="140" width="560" height="56" rx="16" fill="#E3EDE6" stroke="#2D6A4F" stroke-width="1.5"/>
  <text x="400" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#1B4332">Spillet er «Planlagt» (fra flyt 4)</text>
  <line x1="400" y1="196" x2="400" y2="220" stroke="#5E6B63" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 0b before the start: move the round, the group is told (NY #2480) -->
  <line x1="680" y1="168" x2="758" y2="168" stroke="#C9A961" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="760" y="126" width="320" height="86" rx="14" fill="#FBF6EA" stroke="#C9A961" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="1006" y="134" width="60" height="20" rx="10" fill="#C9A961"/><text x="1036" y="148" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">#2480</text>
  <text x="782" y="150" font-size="14.5" font-weight="600" fill="#7A5E13">NY: «Flytt runden»</text>
  <text x="782" y="172" font-size="12.5" fill="#6B5526">ny dag og tid · «Si fra til gjengen» står på</text>
  <text x="782" y="192" font-size="12.5" fill="#6B5526">alle på lista får varsel (også fra «Rediger»)</text>

  <!-- 0c the evening before: the organiser's status (NY #2483) -->
  <rect x="120" y="222" width="560" height="64" rx="14" fill="#FBF6EA" stroke="#C9A961" stroke-width="1.8"/>
  <rect x="610" y="230" width="60" height="20" rx="10" fill="#C9A961"/><text x="640" y="244" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">#2483</text>
  <text x="156" y="250" font-size="14.5" font-weight="600" fill="#7A5E13">NY: «Klar for i morgen?» kvelden før, kl. 18</text>
  <text x="156" y="270" font-size="11.5" fill="#6B5526">varsel med hvem som har bekreftet · «Purr Kari» rett i lista · bane, tee-off, flights</text>
  <line x1="400" y1="286" x2="400" y2="310" stroke="#5E6B63" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 1 start -->
  <rect x="120" y="310" width="560" height="58" rx="14" fill="#FFFFFF" stroke="#D8C089" stroke-width="1.5"/>
  <circle cx="156" cy="339" r="16" fill="#B8973F"/><text x="156" y="344" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
  <text x="190" y="345" font-size="16" fill="#213029">Runden starter (auto ved tee-off / «Start nå»)</text>
  <line x1="400" y1="368" x2="400" y2="392" stroke="#5E6B63" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 2 monitor -->
  <rect x="120" y="394" width="560" height="72" rx="14" fill="#FFFFFF" stroke="#D8C089" stroke-width="1.5"/>
  <circle cx="156" cy="430" r="16" fill="#B8973F"/><text x="156" y="435" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
  <text x="190" y="426" font-size="16" fill="#213029">Følg med mens de spiller</text>
  <text x="190" y="448" font-size="12.5" fill="#6B7770">godkjenn, legg til etternølere, fiks feil</text>
  <line x1="400" y1="466" x2="400" y2="490" stroke="#5E6B63" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 2.5 auto reminder (NY #376) -->
  <rect x="120" y="492" width="560" height="64" rx="14" fill="#FBF6EA" stroke="#C9A961" stroke-width="1.8"/>
  <rect x="610" y="500" width="44" height="20" rx="10" fill="#C9A961"/><text x="632" y="514" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">#376</text>
  <text x="156" y="531" font-size="19">🔔</text>
  <text x="190" y="520" font-size="14.5" font-weight="600" fill="#7A5E13">NY: auto-varsel når spilleren er ferdig (hull 18)</text>
  <text x="190" y="540" font-size="11.5" fill="#6B5526">«husk å levere» — automatisk · admin kan også purre i tillegg</text>
  <line x1="400" y1="556" x2="400" y2="580" stroke="#5E6B63" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 3 end gate (NY #375, NY #2200) -->
  <rect x="120" y="582" width="560" height="120" rx="14" fill="#FBF6EA" stroke="#C9A961" stroke-width="1.8"/>
  <rect x="610" y="590" width="44" height="20" rx="10" fill="#C9A961"/><text x="632" y="604" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">#375</text>
  <text x="156" y="626" font-size="20">🏁</text>
  <text x="190" y="612" font-size="16" font-weight="600" fill="#7A5E13">«Avslutt spillet» — kan aldri låse seg</text>
  <text x="190" y="634" font-size="12.5" fill="#6B5526">mangler noen? «Avslutt likevel» viser hvem,</text>
  <text x="190" y="652" font-size="12.5" fill="#6B5526">de markeres «ikke fullført» — ingen no-show stopper deg</text>
  <rect x="610" y="660" width="60" height="20" rx="10" fill="#C9A961"/><text x="640" y="674" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">#2200</text>
  <text x="190" y="674" font-size="12.5" fill="#6B5526">NY: den som fører, leverer for flighten, også for gjester</text>
  <text x="190" y="692" font-size="12.5" fill="#6B5526">ingen «Avslutt likevel» for dem · statussiden viser «Levert av Kari»</text>
  <line x1="400" y1="702" x2="400" y2="726" stroke="#5E6B63" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 4 terminal (NY #377) -->
  <rect x="120" y="728" width="560" height="86" rx="16" fill="#F4EBD7" stroke="#C9A961" stroke-width="1.6"/>
  <rect x="610" y="736" width="44" height="20" rx="10" fill="#C9A961"/><text x="632" y="750" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">#377</text>
  <text x="400" y="764" text-anchor="middle" font-size="17" font-weight="700" fill="#8A6D27">✓  «Avsluttet» — resultatet er klart</text>
  <text x="400" y="787" text-anchor="middle" font-size="12.5" fill="#9C8552">leaderboard for alle · varsel i appen først til alle</text>
  <text x="400" y="805" text-anchor="middle" font-size="11.5" fill="#9C8552">mail kun til off-app · ingen egen avslutningsmail til alle</text>
  <line x1="400" y1="814" x2="400" y2="838" stroke="#5E6B63" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 4b optional: the prize-giving on the big screen (NY #2298) -->
  <rect x="120" y="840" width="560" height="80" rx="14" fill="#FBF6EA" stroke="#C9A961" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="610" y="848" width="60" height="20" rx="10" fill="#C9A961"/><text x="640" y="862" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">#2298</text>
  <text x="156" y="876" font-size="19">🏆</text>
  <text x="190" y="866" font-size="15" font-weight="600" fill="#7A5E13">NY: Premieutdelingen på TV-en, styrt fra mobilen</text>
  <text x="190" y="886" font-size="12.5" fill="#6B5526">valgfritt · sidepremiene → 3. plass → 2. plass → «Avslør vinneren»</text>
  <text x="190" y="904" font-size="12.5" fill="#6B5526">slagspill, stableford og lagformatene · spillerne har resultatet alt</text>
  <line x1="400" y1="920" x2="400" y2="944" stroke="#5E6B63" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 5 revansje (NY #1007) -->
  <rect x="120" y="946" width="560" height="80" rx="14" fill="#FBF6EA" stroke="#C9A961" stroke-width="1.8"/>
  <rect x="610" y="954" width="60" height="20" rx="10" fill="#C9A961"/><text x="640" y="968" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">#1007</text>
  <text x="156" y="982" font-size="19">🔁</text>
  <text x="190" y="972" font-size="15" font-weight="600" fill="#7A5E13">NY: «Revansje?» — alle deltakere, ikke bare arrangøren</text>
  <text x="190" y="992" font-size="12.5" fill="#6B5526">samme bane/format/sideturnering/spillerliste ferdig utfylt —</text>
  <text x="190" y="1010" font-size="12.5" fill="#6B5526">skjult for cup-matches og liga-runder</text>
  <line x1="400" y1="1026" x2="400" y2="1050" stroke="#5E6B63" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 6 back to flow 04 -->
  <rect x="120" y="1052" width="560" height="52" rx="16" fill="#1B4332"/>
  <text x="400" y="1084" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">→ Opprett spill (flyt 4), ferdig utfylt</text>

  <!-- right rail -->
  <rect x="760" y="310" width="320" height="387" rx="16" fill="#EDF5EF" stroke="#2D6A4F" stroke-width="1.3"/>
  <text x="920" y="340" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B4332">Hva endret seg</text>
  <text x="782" y="372" font-size="13" fill="#46604F">✓ Avslutning kan aldri</text>
  <text x="782" y="391" font-size="13" fill="#46604F">  låses av en no-show (#375)</text>
  <text x="782" y="417" font-size="13" fill="#46604F">✓ Auto-purr når spilleren</text>
  <text x="782" y="436" font-size="13" fill="#46604F">  er ferdig (#376)</text>
  <text x="782" y="462" font-size="13" fill="#46604F">✓ Varsel i appen først;</text>
  <text x="782" y="481" font-size="13" fill="#46604F">  mail kun off-app (#377)</text>
  <text x="782" y="507" font-size="13" fill="#46604F">✓ «Revansje?» dupliserer</text>
  <text x="782" y="526" font-size="13" fill="#46604F">  spillet inn i opprett-</text>
  <text x="782" y="545" font-size="13" fill="#46604F">  veiviseren (#1007)</text>
  <text x="782" y="571" font-size="13" fill="#46604F">✓ Den som fører, leverer for</text>
  <text x="782" y="590" font-size="13" fill="#46604F">  flighten og gjestene (#2200)</text>
  <text x="782" y="623" font-size="12" fill="#6B7770">Resten av flyten (start,</text>
  <text x="782" y="640" font-size="12" fill="#6B7770">godkjenn, gjenåpne) uendret.</text>
  <text x="782" y="663" font-size="12" fill="#6B7770">Epic: «Runden sår den neste»</text>
  <text x="782" y="680" font-size="12" fill="#6B7770">(#1006).</text>

  <!-- split cup-day: blind reveal at organizer-finish (NY #1441) -->
  <rect x="760" y="715" width="320" height="150" rx="16" fill="#EDF5EF" stroke="#2D6A4F" stroke-width="1.3"/>
  <rect x="782" y="729" width="60" height="20" rx="10" fill="#C9A961"/><text x="812" y="743" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">#1441</text>
  <text x="920" y="745" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B4332">Splittet cup-dag</text>
  <text x="782" y="771" font-size="13" fill="#46604F">✓ Bunten (greensome ute +</text>
  <text x="782" y="790" font-size="13" fill="#46604F">  best ball inne + 2 avledede</text>
  <text x="782" y="809" font-size="13" fill="#46604F">  singler) er blind — steg 3</text>
  <text x="782" y="828" font-size="13" fill="#46604F">  «Avslutt spillet» avslører</text>
  <text x="782" y="847" font-size="13" fill="#46604F">  vektede poeng + sidepoeng</text>

  <!-- the organiser hears about the round (NY #2203) -->
  <rect x="760" y="883" width="320" height="132" rx="16" fill="#FBF6EA" stroke="#C9A961" stroke-width="1.8"/>
  <rect x="782" y="897" width="60" height="20" rx="10" fill="#C9A961"/><text x="812" y="911" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">#2203</text>
  <text x="852" y="913" font-size="14.5" font-weight="700" fill="#7A5E13">Arrangøren får beskjed</text>
  <text x="782" y="939" font-size="13" fill="#6B5526">NY: hver levering i innboksen + push</text>
  <text x="782" y="958" font-size="13" fill="#6B5526">  (arrangøren, ikke admin; ingen mail)</text>
  <text x="782" y="977" font-size="13" fill="#6B5526">NY: «Alle har levert. Avslutt spillet.»</text>
  <text x="782" y="996" font-size="13" fill="#6B5526">NY: påminnelse etter et døgn stille</text>

  <!-- before the start: cancel the round, the group is told (NY #2481) -->
  <rect x="760" y="1033" width="320" height="88" rx="14" fill="#FBF6EA" stroke="#C9A961" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="1006" y="1041" width="60" height="20" rx="10" fill="#C9A961"/><text x="1036" y="1055" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">#2481</text>
  <text x="782" y="1057" font-size="14.5" font-weight="600" fill="#7A5E13">NY: «Avlys runden» før start</text>
  <text x="782" y="1079" font-size="12.5" fill="#6B5526">fra «Planlagt» · alle på lista får beskjed,</text>
  <text x="782" y="1099" font-size="12.5" fill="#6B5526">med din hilsen · gamle varsler ryddes bort</text>

  <!-- player parallel -->
  <text x="120" y="1146" font-size="13.5" font-weight="700" fill="#1B4332">Hva spilleren opplever parallelt</text>
  <text x="120" y="1172" font-size="13" fill="#46524B">Planlagt → «Du er påmeldt», varsel om runden flyttes eller avlyses · Pågående → taster slag, auto-purr når ferdig · Avsluttet → varsel + endelig leaderboard + «Revansje?».</text>

  <text x="120" y="1219" font-size="12.5" fill="#9A937F">Kjernen: arrangøren mister aldri kontrollen over å få avsluttet — og runden sår den neste selv.</text>
</svg>
